<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Let's Go Green! password</title>
  </head>
  <body style="margin:0;background:#edf7ee;color:#123524;font-family:Arial,sans-serif">
    <main style="max-width:560px;margin:0 auto;padding:40px 24px">
      <h1 style="font-size:28px;margin:0 0 16px">Reset your password</h1>
      <p style="line-height:1.6">
        Use the secure link below to choose a new Let's Go Green! password.
      </p>
      <p style="margin:28px 0">
        <a
          href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery"
          style="display:inline-block;border-radius:999px;background:#174f34;color:#ffffff;padding:14px 20px;font-weight:700;text-decoration:none"
        >
          Choose a new password
        </a>
      </p>
      <p style="line-height:1.6;color:#456253">
        If you did not request a password reset, you can ignore this message.
      </p>
    </main>
  </body>
</html>
