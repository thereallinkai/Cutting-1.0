<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your Let's Go Green! email</title>
  </head>
  <body style="margin:0;background:#edf7ee;color:#123524;font-family:Arial,sans-serif">
    <main style="max-width:560px;margin:0 auto;padding:40px 24px">
      <h1 style="font-size:28px;margin:0 0 16px">Verify your email</h1>
      <p style="line-height:1.6">
        Enter this six-digit code in Let's Go Green!:
      </p>
      <p
        style="margin:24px 0;padding:18px;border-radius:12px;background:#fbfef9;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center"
      >
        {{ .Token }}
      </p>
      <p style="line-height:1.6;color:#456253">
        The code expires in one hour. If you did not create this account, you
        can ignore this message.
      </p>
    </main>
  </body>
</html>
