name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_openai_smoke:
        description: Run one protected real-OpenAI smoke request
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-suite:
    name: Local mock-backed suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      AI_PROVIDER: mock
      ENABLE_REAL_AI: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global npm@10.9.8

      - name: Bootstrap exact dependencies and local services
        run: npm run bootstrap

      - name: Check generated database type drift
        run: |
          npm run db:types:check
          git diff --exit-code -- src/types/database.ts

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test

      - name: Run database and RLS tests
        run: npm run test:db

      - name: Build the production application
        run: npm run build

      - name: Run Playwright end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload useful browser diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local services
        if: always()
        run: npm run down

  real-openai-smoke:
    name: Protected real OpenAI smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.run_openai_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: openai-smoke
    env:
      AI_PROVIDER: openai
      ENABLE_REAL_AI: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install exact dependencies
        run: |
          npm install --global npm@10.9.8
          npm ci

      - name: Run one budget-bounded real-provider request
        run: npm run openai:smoke
